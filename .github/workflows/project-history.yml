name: Project history

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    if: >-
      github.event_name == 'release' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: project-history-default-branch
      cancel-in-progress: false
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Refresh project history
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          for attempt in 1 2 3; do
            git fetch --prune origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" '+refs/tags/*:refs/tags/*'
            git checkout --detach "refs/remotes/origin/$DEFAULT_BRANCH"
            python3 scripts/update_project_history.py
            git add -- CHANGELOG.md CONTRIBUTORS.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh project history' -m 'Project-History-Refresh: generated'
            if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then exit 0; fi
            # Retry from the new tip if another commit arrived while generating.
            if [[ "$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)" == "$(git rev-parse HEAD^)" ]]; then exit 1; fi
          done
          exit 1
