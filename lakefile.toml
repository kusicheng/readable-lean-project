name = "lean-to-latex"
defaultTargets = ["DevelopmentProofs", "AutomatedProofs"]

[[lean_lib]]
name = "DevelopmentProofs"
roots = ["proofs.Development"]

[[lean_lib]]
name = "AutomatedProofs"
roots = ["proofs.Automation"]

[[lean_lib]]
name = "ReservedProofs"
roots = ["proofs.Reserved"]

[[lean_lib]]
name = "ParityProofs"
roots = ["proofs.PilotParity"]

[[lean_lib]]
name = "ProgressionProofs"
roots = ["proofs.PilotProgressions"]

[[lean_lib]]
name = "CombinatoricsPapers"
roots = ["proofs.Counting580", "proofs.Incidence580", "proofs.Optimization580",
         "proofs.FirstMoment580", "proofs.Intersecting580"]
